<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 265" width="1200" height="265" role="img" >
<title>単一実装の単一障害点（全滅リスク）と複数実装の多様性による耐障害性の対比図</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="20" y="15" width="540" height="230" rx="12" fill="#fff5f5" stroke="#fca5a5" /><text x="290" y="52" font-size="22" fill="#b91c1c" text-anchor="middle" font-weight="700">単一実装（Single Client）の弱点</text><rect x="40" y="70" width="500" height="155" rx="8" fill="white" stroke="#fecaca" /><rect x="70" y="95" width="140" height="105" rx="8" fill="#fee2e2" stroke="#f87171" /><text x="140" y="145" font-size="18" fill="#991b1b" text-anchor="middle" font-weight="700">単一バイナリ</text><text x="140" y="175" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="400">全ノード共通</text><path d="M225 150 H275" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/><text x="400" y="125" font-size="19" fill="#18334c" text-anchor="middle" font-weight="400">1つのゼロデイ・バグで</text><text x="400" y="160" font-size="22" fill="#dc2626" text-anchor="middle" font-weight="700">全ノードが共倒れ</text><text x="400" y="195" font-size="16" fill="#516575" text-anchor="middle" font-weight="400">（ネットワーク完全停止）</text><rect x="640" y="15" width="540" height="230" rx="12" fill="#f0fdf4" stroke="#86efac" /><text x="910" y="52" font-size="22" fill="#15803d" text-anchor="middle" font-weight="700">複数実装（Multi-Client）による安全弁</text><rect x="660" y="70" width="500" height="155" rx="8" fill="white" stroke="#bbf7d0" /><rect x="685" y="95" width="50" height="105" rx="6" fill="#f8fafc" stroke="#006ba6" /><text x="710" y="155" font-size="14" fill="#006ba6" text-anchor="middle" font-weight="700">Rust</text><rect x="743" y="95" width="50" height="105" rx="6" fill="#f8fafc" stroke="#a84c1d" /><text x="768" y="155" font-size="14" fill="#a84c1d" text-anchor="middle" font-weight="700">Nim</text><rect x="801" y="95" width="50" height="105" rx="6" fill="#f8fafc" stroke="#18334c" /><text x="826" y="155" font-size="14" fill="#18334c" text-anchor="middle" font-weight="700">Java</text><rect x="859" y="95" width="50" height="105" rx="6" fill="#f8fafc" stroke="#6541a5" /><text x="884" y="155" font-size="14" fill="#6541a5" text-anchor="middle" font-weight="700">TS</text><path d="M930 150 H975" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/><text x="1065" y="125" font-size="18" fill="#18334c" text-anchor="middle" font-weight="400">1実装に障害があっても</text><text x="1065" y="160" font-size="20" fill="#16a34a" text-anchor="middle" font-weight="700">他が合意を継続（&gt;2/3）</text><text x="1065" y="195" font-size="16" fill="#516575" text-anchor="middle" font-weight="400">（チェーンは無停止）</text><text x="600" y="140" font-size="26" fill="#18334c" text-anchor="middle" font-weight="700">vs</text></g>
</svg>
