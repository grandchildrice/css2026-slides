<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" >
<title>同じ参加者集合と同じ票の重みなら、2つの3分の2の支持集合は少なくとも3分の1重なる。面積比は数量を表さない模式図</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><defs><clipPath id="right"><circle cx="700" cy="160" r="145"/></clipPath></defs><circle cx="490" cy="160" r="145" fill="#eef6fc" stroke="#006ba6" stroke-width="4"/><circle cx="700" cy="160" r="145" fill="#f5f1fc" stroke="#6541a5" stroke-width="4"/><circle cx="490" cy="160" r="145" fill="#ffe49b" clip-path="url(#right)"/><text x="195" y="85" font-size="28" fill="#006ba6" text-anchor="middle" font-weight="700">記録 A を支持</text><text x="195" y="125" font-size="29" fill="#006ba6" text-anchor="middle" font-weight="400">重み ≥ 2/3</text><text x="1000" y="85" font-size="28" fill="#6541a5" text-anchor="middle" font-weight="700">記録 B を支持</text><text x="1000" y="125" font-size="29" fill="#6541a5" text-anchor="middle" font-weight="400">重み ≥ 2/3</text><path d="M325 100 H350 M846 100 H865" stroke="#8baec7" stroke-width="3"/><circle cx="423" cy="115" r="15" fill="#006ba6"/><path d="M397 165 Q397 139 423 139 Q449 139 449 165" fill="#006ba6"/><circle cx="594" cy="115" r="15" fill="#9b6b00"/><path d="M568 165 Q568 139 594 139 Q620 139 620 165" fill="#9b6b00"/><circle cx="767" cy="115" r="15" fill="#6541a5"/><path d="M741 165 Q741 139 767 139 Q793 139 793 165" fill="#6541a5"/><text x="595" y="211" font-size="29" fill="#805600" text-anchor="middle" font-weight="700">≥ 1/3</text><text x="595" y="260" font-size="24" fill="#805600" text-anchor="middle" font-weight="400">両方を支持</text><text x="195" y="246" font-size="25" fill="#18334c" text-anchor="middle" font-weight="400">同じ参加者集合</text><text x="1000" y="246" font-size="25" fill="#18334c" text-anchor="middle" font-weight="400">同じ票の重み</text></g>
