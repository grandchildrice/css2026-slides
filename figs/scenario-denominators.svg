<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 315" width="1200" height="315" role="img" data-scenario="illustrative">
<title>仮想例。8人のうち実装Aは1〜6、実装Bは3〜8を対象にする。それぞれ4人が支持し4/6を満たすが、支持者は重ならない。色付きは支持、白は対象内で非支持、灰色は対象外</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><text x="15" y="89" font-size="30" fill="#006ba6" text-anchor="start" font-weight="700">実装A</text><rect x="165" y="55" width="72" height="66" rx="8" fill="#006ba6" stroke="#006ba6" data-side="A" data-person="1" data-included="true" data-support="true"/><text x="201" y="98" font-size="30" fill="white" text-anchor="middle" font-weight="700">1</text><rect x="253" y="55" width="72" height="66" rx="8" fill="#006ba6" stroke="#006ba6" data-side="A" data-person="2" data-included="true" data-support="true"/><text x="289" y="98" font-size="30" fill="white" text-anchor="middle" font-weight="700">2</text><rect x="341" y="55" width="72" height="66" rx="8" fill="#006ba6" stroke="#006ba6" data-side="A" data-person="3" data-included="true" data-support="true"/><text x="377" y="98" font-size="30" fill="white" text-anchor="middle" font-weight="700">3</text><rect x="429" y="55" width="72" height="66" rx="8" fill="#006ba6" stroke="#006ba6" data-side="A" data-person="4" data-included="true" data-support="true"/><text x="465" y="98" font-size="30" fill="white" text-anchor="middle" font-weight="700">4</text><rect x="517" y="55" width="72" height="66" rx="8" fill="white" stroke="#006ba6" data-side="A" data-person="5" data-included="true" data-support="false"/><text x="553" y="98" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">5</text><rect x="605" y="55" width="72" height="66" rx="8" fill="white" stroke="#006ba6" data-side="A" data-person="6" data-included="true" data-support="false"/><text x="641" y="98" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">6</text><rect x="693" y="55" width="72" height="66" rx="8" fill="#e4e9ee" stroke="#cbd8e2" data-side="A" data-person="7" data-included="false" data-support="false"/><text x="729" y="98" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">7</text><rect x="781" y="55" width="72" height="66" rx="8" fill="#e4e9ee" stroke="#cbd8e2" data-side="A" data-person="8" data-included="false" data-support="false"/><text x="817" y="98" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">8</text><text x="940" y="99" font-size="35" fill="#006ba6" text-anchor="start" font-weight="700">4 / 6 = 2/3</text><text x="170" y="149" font-size="23" fill="#18334c" text-anchor="start" font-weight="400">対象：1, 2, 3, 4, 5, 6　　支持：1, 2, 3, 4</text><text x="15" y="214" font-size="30" fill="#a84c1d" text-anchor="start" font-weight="700">実装B</text><rect x="165" y="180" width="72" height="66" rx="8" fill="#e4e9ee" stroke="#cbd8e2" data-side="B" data-person="1" data-included="false" data-support="false"/><text x="201" y="223" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">1</text><rect x="253" y="180" width="72" height="66" rx="8" fill="#e4e9ee" stroke="#cbd8e2" data-side="B" data-person="2" data-included="false" data-support="false"/><text x="289" y="223" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">2</text><rect x="341" y="180" width="72" height="66" rx="8" fill="white" stroke="#a84c1d" data-side="B" data-person="3" data-included="true" data-support="false"/><text x="377" y="223" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">3</text><rect x="429" y="180" width="72" height="66" rx="8" fill="white" stroke="#a84c1d" data-side="B" data-person="4" data-included="true" data-support="false"/><text x="465" y="223" font-size="30" fill="#18334c" text-anchor="middle" font-weight="700">4</text><rect x="517" y="180" width="72" height="66" rx="8" fill="#a84c1d" stroke="#a84c1d" data-side="B" data-person="5" data-included="true" data-support="true"/><text x="553" y="223" font-size="30" fill="white" text-anchor="middle" font-weight="700">5</text><rect x="605" y="180" width="72" height="66" rx="8" fill="#a84c1d" stroke="#a84c1d" data-side="B" data-person="6" data-included="true" data-support="true"/><text x="641" y="223" font-size="30" fill="white" text-anchor="middle" font-weight="700">6</text><rect x="693" y="180" width="72" height="66" rx="8" fill="#a84c1d" stroke="#a84c1d" data-side="B" data-person="7" data-included="true" data-support="true"/><text x="729" y="223" font-size="30" fill="white" text-anchor="middle" font-weight="700">7</text><rect x="781" y="180" width="72" height="66" rx="8" fill="#a84c1d" stroke="#a84c1d" data-side="B" data-person="8" data-included="true" data-support="true"/><text x="817" y="223" font-size="30" fill="white" text-anchor="middle" font-weight="700">8</text><text x="940" y="224" font-size="35" fill="#a84c1d" text-anchor="start" font-weight="700">4 / 6 = 2/3</text><text x="170" y="274" font-size="23" fill="#18334c" text-anchor="start" font-weight="400">対象：3, 4, 5, 6, 7, 8　　支持：5, 6, 7, 8</text></g>
</svg>
