<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" >
<title>仕様準拠の実装の中に、前提Pを満たす領域（保証Qが効く）と満たさない領域（定理は何も言わない）がある。Pを満たすかどうかの境界は仕様の手順に書かれていない</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="30" y="20" width="1140" height="350" rx="14" fill="#f7fafc" stroke="#516575" /><text x="60" y="66" font-size="28" fill="#18334c" text-anchor="start" font-weight="700">仕様 S に従う実装（仕様準拠）＝ この全体</text><text x="1140" y="66" font-size="22" fill="#516575" text-anchor="end" font-weight="400">証明が検査したのは：P ⇒ Q</text><rect x="70" y="95" width="500" height="210" rx="12" fill="#eef6fc" stroke="#006ba6" /><text x="320" y="152" font-size="27" fill="#006ba6" text-anchor="middle" font-weight="700">前提 P を満たす実装</text><text x="320" y="208" font-size="31" fill="#18334c" text-anchor="middle" font-weight="700">保証 Q が効く世界</text><text x="320" y="258" font-size="20" fill="#516575" text-anchor="middle" font-weight="400">（安全が数学的に保証される）</text><line x1="600" y1="95" x2="600" y2="305" stroke="#a84c1d" stroke-width="4" stroke-dasharray="9 8"/><rect x="630" y="95" width="500" height="210" rx="12" fill="#fff6ee" stroke="#a84c1d" /><text x="880" y="152" font-size="27" fill="#a84c1d" text-anchor="middle" font-weight="700">前提 P を満たさない実装</text><text x="880" y="208" font-size="31" fill="#18334c" text-anchor="middle" font-weight="700">保証対象外</text><text x="880" y="258" font-size="20" fill="#516575" text-anchor="middle" font-weight="400">（壊れるとは、言っていない）</text><text x="600" y="345" font-size="23" fill="#a84c1d" text-anchor="middle" font-weight="700">境界（P を満たすか）は仕様の手順に書かれていない → 仕様を読むだけでは、実装がどちらにいるか分からない</text></g>
</svg>
