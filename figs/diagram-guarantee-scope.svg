<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 395" width="1200" height="395" role="img" >
<title>証明は保証書。前提Pを満たすなら安全Qを保証すると書くが、届くのはPを満たす実装だけ。満たさない実装は保証対象外（壊れるとは言っていない）。どちらの実装にも同じ「仕様どおり」の印が押されており、違いは前提Pを満たすかだけなので、仕様を読むだけでは区別がつかない</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="330" y="8" width="540" height="90" rx="12" fill="#f5f1fc" stroke="#6541a5" /><text x="600" y="46" font-size="29" fill="#6541a5" text-anchor="middle" font-weight="700">証明 ＝ 保証書</text><text x="600" y="82" font-size="21" fill="#18334c" text-anchor="middle" font-weight="400">「前提 P を満たすなら、安全 Q を保証」</text><path d="M400 98 V142" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><text x="430" y="126" font-size="20" fill="#006ba6" text-anchor="start" font-weight="700">保証が届く</text><path d="M800 98 V142" fill="none" stroke="#a84c1d" stroke-width="3.5" stroke-dasharray="8 6"/><text x="770" y="126" font-size="20" fill="#a84c1d" text-anchor="end" font-weight="700">✕ 届かない</text><rect x="40" y="148" width="540" height="178" rx="12" fill="#eef6fc" stroke="#006ba6" /><rect x="88" y="164" width="168" height="38" rx="19" fill="#ffffff" stroke="#006ba6" /><text x="172" y="190" font-size="21" fill="#006ba6" text-anchor="middle" font-weight="700">仕様どおり</text><text x="310" y="246" font-size="25" fill="#006ba6" text-anchor="middle" font-weight="700">前提 P を満たす実装</text><text x="310" y="290" font-size="27" fill="#18334c" text-anchor="middle" font-weight="700">→ 保証が効く（安全）</text><rect x="620" y="148" width="540" height="178" rx="12" fill="#fff6ee" stroke="#a84c1d" /><rect x="668" y="164" width="168" height="38" rx="19" fill="#ffffff" stroke="#a84c1d" /><text x="752" y="190" font-size="21" fill="#a84c1d" text-anchor="middle" font-weight="700">仕様どおり</text><text x="890" y="246" font-size="25" fill="#a84c1d" text-anchor="middle" font-weight="700">前提 P を満たさない実装</text><text x="890" y="290" font-size="27" fill="#18334c" text-anchor="middle" font-weight="700">→ 保証対象外</text><text x="890" y="318" font-size="18" fill="#516575" text-anchor="middle" font-weight="400">（壊れるとは、言っていない）</text><text x="600" y="352" font-size="22" fill="#516575" text-anchor="middle" font-weight="700">同じ「仕様どおり」の印。違いは 前提 P を満たすかだけ。</text><text x="600" y="384" font-size="23" fill="#a84c1d" text-anchor="middle" font-weight="700">→ 仕様を読むだけでは、区別がつかない</text></g>
</svg>
