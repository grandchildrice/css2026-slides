<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 395" width="1200" height="395" role="img" >
<title>証明は保証書。前提Pを満たすなら安全Qを保証すると書くが、届くのはPを満たす実装だけ。満たさない実装は保証対象外（壊れるとは言っていない）。どちらも仕様準拠で、Pを満たすかは仕様に書かれていない</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="300" y="12" width="600" height="100" rx="12" fill="#f5f1fc" stroke="#6541a5" /><text x="600" y="55" font-size="30" fill="#6541a5" text-anchor="middle" font-weight="700">証明 ＝ 保証書</text><text x="600" y="93" font-size="22" fill="#18334c" text-anchor="middle" font-weight="400">「前提 P を満たすなら、安全 Q を保証」</text><path d="M330 118 V168" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><text x="365" y="148" font-size="20" fill="#006ba6" text-anchor="start" font-weight="700">保証が届く</text><path d="M870 118 V168" fill="none" stroke="#a84c1d" stroke-width="3.5" stroke-dasharray="8 6"/><text x="845" y="148" font-size="20" fill="#a84c1d" text-anchor="end" font-weight="700">✕ 届かない</text><rect x="60" y="175" width="520" height="135" rx="12" fill="#eef6fc" stroke="#006ba6" /><text x="320" y="218" font-size="26" fill="#006ba6" text-anchor="middle" font-weight="700">前提 P を満たす実装</text><text x="320" y="262" font-size="29" fill="#18334c" text-anchor="middle" font-weight="700">保証が効く</text><text x="320" y="295" font-size="19" fill="#516575" text-anchor="middle" font-weight="400">（安全が数学的に保証される）</text><rect x="640" y="175" width="520" height="135" rx="12" fill="#fff6ee" stroke="#a84c1d" /><text x="900" y="218" font-size="26" fill="#a84c1d" text-anchor="middle" font-weight="700">前提 P を満たさない実装</text><text x="900" y="262" font-size="29" fill="#18334c" text-anchor="middle" font-weight="700">保証対象外</text><text x="900" y="295" font-size="19" fill="#516575" text-anchor="middle" font-weight="400">（壊れるとは、言っていない）</text><text x="600" y="340" font-size="21" fill="#516575" text-anchor="middle" font-weight="700">どちらも仕様どおりに作られている（仕様準拠）</text><text x="600" y="375" font-size="22" fill="#a84c1d" text-anchor="middle" font-weight="700">「前提を満たすか」は仕様に書かれていない → 読むだけでは区別がつかない</text></g>
</svg>
