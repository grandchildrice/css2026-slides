<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" >
<title>Ethereumの二層構造：実行層（EL）と合意層（CL）。本研究が対象とする合意層では複数クライアントが同一仕様に基づきPoS合意を形成する</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="20" y="25" width="540" height="280" rx="14" fill="#f8fafc" stroke="#cbd8e2" /><rect x="35" y="40" width="510" height="48" rx="8" fill="#eef6fc" stroke="#006ba6" /><text x="290" y="72" font-size="22" fill="#006ba6" text-anchor="middle" font-weight="700">実行層（Execution Layer: EL）</text><text x="290" y="125" font-size="21" fill="#18334c" text-anchor="middle" font-weight="400">取引（Tx）の実行・スマートコントラクト</text><text x="290" y="160" font-size="20" fill="#516575" text-anchor="middle" font-weight="400">状態木（State Trie）の更新・残高管理</text><rect x="55" y="195" width="470" height="85" rx="8" fill="white" stroke="#cbd8e2" /><text x="290" y="230" font-size="19" fill="#18334c" text-anchor="middle" font-weight="700">多様な独立クライアント群</text><text x="290" y="260" font-size="21" fill="#006ba6" text-anchor="middle" font-weight="700">Geth / Nethermind / Besu / Erigon</text><rect x="640" y="25" width="540" height="280" rx="14" fill="#f5f1fc" stroke="#6541a5" /><rect x="655" y="40" width="510" height="48" rx="8" fill="#f5f1fc" stroke="#6541a5" /><text x="910" y="72" font-size="22" fill="#6541a5" text-anchor="middle" font-weight="700">合意層（Consensus Layer: CL） ★本研究の対象</text><text x="910" y="125" font-size="21" fill="#18334c" text-anchor="middle" font-weight="400">PoS バリデータ投票・フォーク選択</text><text x="910" y="160" font-size="20" fill="#516575" text-anchor="middle" font-weight="400">チェックポイント正当化・ファイナリティ判定</text><rect x="675" y="195" width="470" height="85" rx="8" fill="white" stroke="#cdbde4" /><text x="910" y="230" font-size="19" fill="#18334c" text-anchor="middle" font-weight="700">多様な独立合意クライアント群</text><text x="910" y="260" font-size="21" fill="#6541a5" text-anchor="middle" font-weight="700">Lighthouse / Nimbus / Teku / Lodestar</text><path d="M560 165 H640" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><path d="M640 175 H560" fill="none" stroke="#6541a5" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="145" font-size="16" fill="#18334c" text-anchor="middle" font-weight="700">Engine API</text></g>
</svg>
