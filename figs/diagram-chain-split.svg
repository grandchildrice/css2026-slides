<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" font-family="Hiragino Sans, Yu Gothic, Meiryo, Helvetica, Arial, sans-serif">
  <title>チェーン分裂の図解：ブロック1〜3は共有。実装AとBが4〜6を別々に確定し、分岐が戻せなくなる</title>
  <rect width="920" height="260" fill="#ffffff"/>
  <!-- 共有部分 -->
  <g>
    <rect x="40" y="120" width="70" height="44" rx="8" fill="#eef6fc" stroke="#18334c" stroke-width="2"/>
    <text x="75" y="148" font-size="20" font-weight="700" text-anchor="middle" fill="#18334c">1</text>
    <rect x="130" y="120" width="70" height="44" rx="8" fill="#eef6fc" stroke="#18334c" stroke-width="2"/>
    <text x="165" y="148" font-size="20" font-weight="700" text-anchor="middle" fill="#18334c">2</text>
    <rect x="220" y="120" width="70" height="44" rx="8" fill="#eef6fc" stroke="#18334c" stroke-width="2"/>
    <text x="255" y="148" font-size="20" font-weight="700" text-anchor="middle" fill="#18334c">3</text>
  </g>
  <text x="40" y="104" font-size="16" fill="#516575">全実装が共有する履歴</text>
  <!-- 実装A -->
  <g stroke="#006ba6" stroke-width="2" fill="#ffffff">
    <rect x="310" y="60" width="70" height="44" rx="8"/>
    <rect x="400" y="60" width="70" height="44" rx="8"/>
    <rect x="490" y="60" width="70" height="44" rx="8"/>
  </g>
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#006ba6">
    <text x="345" y="88">4</text>
    <text x="435" y="88">5</text>
    <text x="525" y="88">6</text>
  </g>
  <text x="310" y="52" font-size="16" font-weight="700" fill="#006ba6">実装A が確定</text>
  <!-- 実装B -->
  <g stroke="#b64b12" stroke-width="2" fill="#ffffff">
    <rect x="310" y="180" width="70" height="44" rx="8"/>
    <rect x="400" y="180" width="70" height="44" rx="8"/>
    <rect x="490" y="180" width="70" height="44" rx="8"/>
  </g>
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#b64b12">
    <text x="345" y="208">4′</text>
    <text x="435" y="208">5′</text>
    <text x="525" y="208">6′</text>
  </g>
  <text x="310" y="172" font-size="16" font-weight="700" fill="#b64b12">実装B が確定</text>
  <!-- 分岐線 -->
  <g stroke="#516575" stroke-width="2" fill="none">
    <path d="M290 142 L310 82"/>
    <path d="M290 142 L310 202"/>
  </g>
  <!-- 結果 -->
  <rect x="600" y="60" width="300" height="164" rx="12" fill="#fdecec" stroke="#c33" stroke-width="2"/>
  <text x="620" y="96" font-size="20" font-weight="700" fill="#18334c">同じ高さで、2つの履歴が確定</text>
  <text x="620" y="130" font-size="18" fill="#263746">片方の確定は覆せない（不可逆）</text>
  <text x="620" y="158" font-size="18" fill="#263746">確定済みの取引が一方で消える</text>
  <text x="620" y="200" font-size="22" font-weight="700" fill="#c33">巨額資産の停止・取引停止</text>
  <path d="M560 82 L600 110" stroke="#c33" stroke-width="2" fill="none"/>
  <path d="M560 202 L600 170" stroke="#c33" stroke-width="2" fill="none"/>
</svg>
