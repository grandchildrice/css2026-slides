<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 265" width="1200" height="265" role="img" >
<title>暗黙前提の解釈差によるチェーン分裂（Chain Split）と資産喪失の危機を示す図解</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="20" y="15" width="1160" height="230" rx="12" fill="#f8fafc" stroke="#cbd8e2" /><rect x="50" y="90" width="80" height="80" rx="8" fill="#eef6fc" stroke="#006ba6" /><text x="90" y="137" font-size="16" fill="#006ba6" text-anchor="middle" font-weight="700">Block 1</text><path d="M130 130 H160" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><rect x="160" y="90" width="80" height="80" rx="8" fill="#eef6fc" stroke="#006ba6" /><text x="200" y="137" font-size="16" fill="#006ba6" text-anchor="middle" font-weight="700">Block 2</text><path d="M240 130 H270" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><rect x="270" y="90" width="80" height="80" rx="8" fill="#eef6fc" stroke="#006ba6" /><text x="310" y="137" font-size="16" fill="#006ba6" text-anchor="middle" font-weight="700">Block 3</text><path d="M350 130 H380" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><text x="160" y="60" font-size="18" fill="#006ba6" text-anchor="middle" font-weight="700">全員が同じ確定履歴（合意成立）</text><rect x="380" y="70" width="120" height="120" rx="10" fill="#fff7ed" stroke="#a84c1d" /><text x="440" y="120" font-size="16" fill="#a84c1d" text-anchor="middle" font-weight="700">暗黙前提の</text><text x="440" y="145" font-size="16" fill="#a84c1d" text-anchor="middle" font-weight="700">解釈不一致</text><path d="M500 110 L590 60" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><rect x="590" y="30" width="160" height="60" rx="8" fill="#eef6fc" stroke="#006ba6" /><text x="670" y="67" font-size="16" fill="#006ba6" text-anchor="middle" font-weight="700">実装A: 履歴Aを確定</text><path d="M500 150 L590 200" fill="none" stroke="#a84c1d" stroke-width="4" marker-end="url(#arrow)"/><rect x="590" y="170" width="160" height="60" rx="8" fill="#fff7ed" stroke="#a84c1d" /><text x="670" y="207" font-size="16" fill="#a84c1d" text-anchor="middle" font-weight="700">実装B: 履歴Bを確定</text><rect x="790" y="45" width="370" height="170" rx="10" fill="#fff1f2" stroke="#f43f5e" /><text x="975" y="85" font-size="18" fill="#be123c" text-anchor="middle" font-weight="700">不可逆なチェーン分裂（Chain Split）</text><text x="975" y="125" font-size="16" fill="#18334c" text-anchor="middle" font-weight="400">・覆せない確定が2通り存在</text><text x="975" y="155" font-size="16" fill="#18334c" text-anchor="middle" font-weight="400">・取引の二重支払い（二重消費）発生</text><text x="975" y="188" font-size="17" fill="#be123c" text-anchor="middle" font-weight="700">・巨額資産喪失・システム停止</text></g>
</svg>
