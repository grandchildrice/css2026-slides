<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" >
<title>理論家は前提Pから保証Qへの証明を持つ。仕様書は実装可能な手順Sを記し、実装者・監査者はSだけを基準にする。前提Pを持つのは上流だけで、下流へ届く道は2つとも閉ざされている。仕様経由は転記で落ち、直接読むにも証明はLeanで実装者・監査者は読めない</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="30" y="55" width="310" height="190" rx="12" fill="#f5f1fc" stroke="#6541a5" /><text x="185" y="100" font-size="26" fill="#6541a5" text-anchor="middle" font-weight="700">理論家（研究・設計）</text><text x="185" y="148" font-size="20" fill="#18334c" text-anchor="middle" font-weight="400">「前提 P なら、この動きで安全」</text><text x="185" y="200" font-size="24" fill="#6541a5" text-anchor="middle" font-weight="700">証明：P ⇒ Q</text><path d="M352 150 H428" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><text x="390" y="136" font-size="22" fill="#18334c" text-anchor="middle" font-weight="400">翻訳</text><rect x="440" y="55" width="320" height="190" rx="12" fill="#eef6fc" stroke="#18334c" /><text x="600" y="100" font-size="29" fill="#18334c" text-anchor="middle" font-weight="700">仕様書</text><text x="600" y="148" font-size="22" fill="#18334c" text-anchor="middle" font-weight="400">「こう動いてね」</text><text x="600" y="200" font-size="23" fill="#18334c" text-anchor="middle" font-weight="700">手順 S（文章＋疑似コード）</text><path d="M772 150 H848" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><text x="810" y="136" font-size="22" fill="#18334c" text-anchor="middle" font-weight="400">利用</text><rect x="860" y="55" width="310" height="190" rx="12" fill="#eef6fc" stroke="#006ba6" /><text x="1015" y="100" font-size="26" fill="#006ba6" text-anchor="middle" font-weight="700">実装者・監査者</text><text x="1015" y="148" font-size="19" fill="#18334c" text-anchor="middle" font-weight="400">「前提がない。いつ正しいの？」</text><text x="1015" y="200" font-size="24" fill="#006ba6" text-anchor="middle" font-weight="700">基準は仕様 S だけ</text><path d="M185 250 V276" fill="none" stroke="#a84c1d" stroke-width="3.5" stroke-dasharray="9 7"/><path d="M185 276 H1015" fill="none" stroke="#a84c1d" stroke-width="3.5" stroke-dasharray="9 7"/><text x="600" y="260" font-size="21" fill="#a84c1d" text-anchor="middle" font-weight="700">前提 P を持つのは上流だけ</text><text x="597" y="288" font-size="30" fill="#a84c1d" text-anchor="middle" font-weight="700">×</text><text x="1012" y="288" font-size="30" fill="#a84c1d" text-anchor="middle" font-weight="700">×</text><text x="600" y="318" font-size="20" fill="#a84c1d" text-anchor="middle" font-weight="700">仕様経由 → 転記で落ちる</text><text x="600" y="346" font-size="20" fill="#a84c1d" text-anchor="middle" font-weight="700">直接読む → 証明は Lean。実装者・監査者は読めない</text></g>
</svg>
