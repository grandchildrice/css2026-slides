<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" >
<title>証明の成果を現場が参照できる形へ：形式証明から抽出された前提条件を、現場が使えるテスト項目・監査チェックリストへ変換するパイプライン</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#006ba6"/></marker></defs>
<g font-family="Arial, Yu Gothic, Meiryo, sans-serif"><rect x="20" y="25" width="340" height="280" rx="12" fill="#f5f1fc" stroke="#6541a5" /><text x="190" y="68" font-size="24" fill="#6541a5" text-anchor="middle" font-weight="700">形式検証の世界</text><text x="190" y="105" font-size="18" fill="#18334c" text-anchor="middle" font-weight="400">定理証明（Lean 4 / Gasper）</text><rect x="38" y="130" width="304" height="150" rx="8" fill="white" stroke="#cdbde4" /><text x="190" y="168" font-size="20" fill="#6541a5" text-anchor="middle" font-weight="700">「前提 P ならば 安全 Q」</text><text x="190" y="205" font-size="17" fill="#18334c" text-anchor="middle" font-weight="400">定理文に厳密な仮説として</text><text x="190" y="235" font-size="17" fill="#18334c" text-anchor="middle" font-weight="400">前提条件が完全に記述</text><text x="190" y="262" font-size="15" fill="#516575" text-anchor="middle" font-weight="400">（機械が受理・抜け漏れゼロ）</text><path d="M360 165 H430" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><rect x="430" y="25" width="340" height="280" rx="12" fill="#eef6fc" stroke="#006ba6" /><text x="600" y="68" font-size="24" fill="#006ba6" text-anchor="middle" font-weight="700">本研究の提案アプローチ</text><text x="600" y="105" font-size="18" fill="#18334c" text-anchor="middle" font-weight="400">構文解析による前提の自動抽出</text><rect x="448" y="130" width="304" height="150" rx="8" fill="white" stroke="#a5cce5" /><text x="600" y="168" font-size="20" fill="#006ba6" text-anchor="middle" font-weight="700">検証可能な確認候補へ変換</text><text x="600" y="205" font-size="17" fill="#18334c" text-anchor="middle" font-weight="400">・変数・集合の型と境界条件</text><text x="600" y="235" font-size="17" fill="#18334c" text-anchor="middle" font-weight="400">・クォーラム交差の成立前提</text><text x="600" y="262" font-size="15" fill="#516575" text-anchor="middle" font-weight="400">・定理と仕様の対応トレーサビリティ</text><path d="M770 165 H840" fill="none" stroke="#006ba6" stroke-width="4" marker-end="url(#arrow)"/><rect x="840" y="25" width="340" height="280" rx="12" fill="#fff6ee" stroke="#a84c1d" /><text x="1010" y="68" font-size="24" fill="#a84c1d" text-anchor="middle" font-weight="700">実装・監査の現場</text><text x="1010" y="105" font-size="18" fill="#18334c" text-anchor="middle" font-weight="400">現場エンジニア・セキュリティ監査</text><rect x="858" y="130" width="304" height="150" rx="8" fill="white" stroke="#e9c4a8" /><text x="1010" y="168" font-size="20" fill="#a84c1d" text-anchor="middle" font-weight="700">テストとコードレビューへの展開</text><text x="1010" y="205" font-size="17" fill="#18334c" text-anchor="middle" font-weight="400">・テストケース（spec-tests）の補強</text><text x="1010" y="235" font-size="17" fill="#18334c" text-anchor="middle" font-weight="400">・監査チェックリストの具体的項目化</text><text x="1010" y="262" font-size="16" fill="#a84c1d" text-anchor="middle" font-weight="700">※現場にLean習得は不要</text></g>
</svg>
